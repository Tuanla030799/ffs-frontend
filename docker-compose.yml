services:
  fds-web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
      NUXT_PUBLIC_API_BASE_URL: ${NUXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
      NUXT_PUBLIC_FILE_BASE_URL: ${NUXT_PUBLIC_FILE_BASE_URL:-http://localhost:8080}
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-http://localhost:3000}
    ports:
      - '3000:3000'
