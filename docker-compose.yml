services:
  fds-web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
      NUXT_PUBLIC_API_BASE_URL: ${NUXT_PUBLIC_API_BASE_URL:-/api}
      NUXT_PUBLIC_API_TIMEOUT: ${NUXT_PUBLIC_API_TIMEOUT:-15000}
      NUXT_PUBLIC_FILE_BASE_URL: ${NUXT_PUBLIC_FILE_BASE_URL:-}
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-http://localhost}
    expose:
      - '3000'
    networks:
      - app-network

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      fds-web:
        condition: service_healthy
    ports:
      - '${FRONTEND_HTTP_PORT:-80}:80'
    volumes:
      - ./deploy/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app-network

networks:
  app-network:
    external: true
    name: thepocketshoes_net
